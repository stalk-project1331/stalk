name: Build Snap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure direct Snap launcher
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.build.snap.useTemplateApp=false; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"

      - name: Install Snapcraft
        run: |
          sudo snap install multipass
          sudo snap install snapcraft --classic --channel=8.x/stable

      - name: Build Snap
        run: npm run package:snap

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: STALK-snap
          path: dist/*.snap
          if-no-files-found: error
