name: Build Snap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic --channel=8.x/stable

      - name: Build Electron application bundle
        run: npm run build && npx electron-builder --linux dir --x64

      - name: Assemble direct-launch Snap
        run: |
          rm -rf snap-root
          mkdir -p snap-root/meta/gui dist
          cp -a dist/linux-unpacked/. snap-root/
          cp assets/STALK.png snap-root/meta/gui/stalk.png
          printf '%s\n' '#!/bin/sh' 'exec "$SNAP/stalk" --ozone-platform=x11 --no-sandbox "$@"' > snap-root/command.sh
          chmod +x snap-root/command.sh
          cat > snap-root/meta/gui/stalk.desktop <<'EOF'
          [Desktop Entry]
          Name=STALK
          Comment=OSINT assistant
          Exec=stalk %U
          Icon=${SNAP}/meta/gui/stalk.png
          Terminal=false
          Type=Application
          Categories=Utility;
          StartupWMClass=STALK
          EOF
          cat > snap-root/meta/snap.yaml <<'EOF'
          name: stalk
          version: '0.3.0'
          summary: STALK
          description: OSINT assistant
          grade: stable
          confinement: classic
          base: core20
          architectures:
            - amd64
          apps:
            stalk:
              command: command.sh
              desktop: meta/gui/stalk.desktop
          EOF

      - name: Pack Snap
        run: snapcraft pack snap-root --output dist

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: STALK-snap
          path: dist/*.snap
          if-no-files-found: error
